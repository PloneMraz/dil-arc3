<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="745" viewBox="0 0 1200 745" font-family="Cambria, 'DejaVu Serif', serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5f8a"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a87a12"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5f8a"/>
    </marker>
  </defs>
  <rect width="1200" height="745" fill="#ffffff"/>

  <!-- the world -->
  <rect x="20" y="20" width="250" height="700" rx="10" fill="#f6f6f6" stroke="#c4c4c4"/>
  <text x="145" y="48" text-anchor="middle" font-size="15" fill="#5a5a5a" letter-spacing="1">THE WORLD</text>
  <rect x="45" y="80" width="200" height="190" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="145" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Region</text>
  <text x="145" y="136" text-anchor="middle" font-size="14" fill="#333">an ARC-AGI-3 game</text>
  <g transform="translate(103,152)">
    <rect width="84" height="84" fill="#eee" stroke="#999"/>
    <rect x="12" y="12" width="20" height="20" fill="#2f5f8a"/><rect x="52" y="12" width="20" height="20" fill="#a87a12"/>
    <rect x="12" y="52" width="20" height="20" fill="#a87a12"/><rect x="32" y="32" width="20" height="20" fill="#1a1a1a"/>
    <rect x="52" y="52" width="20" height="20" fill="#2f5f8a"/>
  </g>
  <rect x="45" y="470" width="200" height="150" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="145" y="502" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Onlooker</text>
  <text x="145" y="526" text-anchor="middle" font-size="14" fill="#333">an Other: sees acts,</text>
  <text x="145" y="546" text-anchor="middle" font-size="14" fill="#333">not the game; says</text>
  <text x="145" y="566" text-anchor="middle" font-size="14" fill="#333">"repeating", "standing</text>
  <text x="145" y="586" text-anchor="middle" font-size="14" fill="#333">still", "back-and-forth"</text>

  <!-- the host -->
  <rect x="305" y="80" width="190" height="130" rx="8" fill="#eef3f8" stroke="#2f5f8a" stroke-width="1.5"/>
  <text x="400" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5f8a">Host</text>
  <text x="400" y="134" text-anchor="middle" font-size="15" fill="#2f5f8a">sensory organs</text>
  <text x="400" y="158" text-anchor="middle" font-size="13" fill="#2f5f8a">take in the frame, the</text>
  <text x="400" y="176" text-anchor="middle" font-size="13" fill="#2f5f8a">status, the onlooker's word;</text>
  <text x="400" y="194" text-anchor="middle" font-size="13" fill="#2f5f8a">compute nothing</text>
  <rect x="305" y="510" width="190" height="110" rx="8" fill="#eef3f8" stroke="#2f5f8a" stroke-width="1.5"/>
  <text x="400" y="540" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5f8a">Host</text>
  <text x="400" y="564" text-anchor="middle" font-size="15" fill="#2f5f8a">effectors</text>
  <text x="400" y="588" text-anchor="middle" font-size="13" fill="#2f5f8a">carry out the command,</text>
  <text x="400" y="606" text-anchor="middle" font-size="13" fill="#2f5f8a">if the region offers it</text>

  <!-- DIL: the field and the layers -->
  <rect x="530" y="40" width="250" height="640" rx="10" fill="#fbf4df" stroke="#a87a12" stroke-dasharray="6 4"/>
  <text x="655" y="60" text-anchor="middle" font-size="12" fill="#8a6410">GLOB-MOD field: trust · alertness ·</text>
  <text x="655" y="75" text-anchor="middle" font-size="12" fill="#8a6410">exploration — acts down on every</text>
  <text x="655" y="90" text-anchor="middle" font-size="12" fill="#8a6410">layer; every layer votes on it</text>
  <g font-size="14" fill="#1a1a1a">
    <rect x="575" y="590" width="160" height="40" rx="5" fill="#fff" stroke="#2f5f8a"/><text x="662" y="615" text-anchor="middle">T1  environment</text>
    <rect x="575" y="535" width="160" height="40" rx="5" fill="#fff" stroke="#2f5f8a"/><text x="655" y="560" text-anchor="middle">T2  agency</text>
    <rect x="575" y="480" width="160" height="40" rx="5" fill="#fff" stroke="#2f5f8a"/><text x="655" y="505" text-anchor="middle">T3  channels</text>
    <rect x="575" y="425" width="160" height="40" rx="5" fill="#fff" stroke="#2f5f8a"/><text x="655" y="450" text-anchor="middle">T4  binding</text>
    <rect x="575" y="345" width="160" height="60" rx="5" fill="#fbf4df" stroke="#a87a12" stroke-width="2"/><text x="655" y="371" text-anchor="middle" font-weight="bold" fill="#8a6410">T5  expectation</text><text x="655" y="392" text-anchor="middle" font-size="12" fill="#8a6410">return ≠ expected → scar</text>
    <rect x="575" y="270" width="160" height="40" rx="5" fill="#fff" stroke="#2f5f8a"/><text x="655" y="295" text-anchor="middle">T6  Others</text>
    <rect x="575" y="215" width="160" height="40" rx="5" fill="#fff" stroke="#2f5f8a"/><text x="655" y="240" text-anchor="middle">T7  absence</text>
    <rect x="575" y="150" width="160" height="50" rx="5" fill="#fff" stroke="#2f5f8a"/><text x="655" y="171" text-anchor="middle">T8  abstraction</text><text x="655" y="189" text-anchor="middle" font-size="11" fill="#5a5a5a">closes back into the loop</text>
  </g>
  <!-- the meaning channel, up: each layer reads the layers it depends on (T2 and T5 feed T6; T5 feeds T7; T6 feeds T8) -->
  <g stroke="#2f5f8a" stroke-width="1.5" fill="none" marker-end="url(#g)">
    <line x1="655" y1="589" x2="655" y2="577"/>
    <line x1="655" y1="479" x2="655" y2="467"/><line x1="655" y1="424" x2="655" y2="407"/>
    <line x1="655" y1="344" x2="655" y2="312"/>
    <path d="M736,555 L770,555 L770,290 L737,290"/>
    <path d="M736,352 L752,352 L752,235 L737,235"/>
    <path d="M574,290 L558,290 L558,175 L573,175"/>
  </g>
  <text x="655" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6410">DIL</text>
  <text x="655" y="136" text-anchor="middle" font-size="12" fill="#8a6410">acts on nothing</text>

  <!-- the mind -->
  <rect x="815" y="300" width="175" height="150" rx="10" fill="#fbf4df" stroke="#a87a12" stroke-width="2"/>
  <text x="902" y="328" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6410">Mind</text>
  <text x="902" y="352" text-anchor="middle" font-size="13" fill="#8a6410">expects; thinks on</text>
  <text x="902" y="370" text-anchor="middle" font-size="13" fill="#8a6410">what collided; chooses</text>
  <rect x="828" y="384" width="149" height="50" rx="6" fill="#ffffff" stroke="#a87a12"/>
  <text x="902" y="405" text-anchor="middle" font-size="13" fill="#8a6410">model (inducer)</text>
  <text x="902" y="423" text-anchor="middle" font-size="11" fill="#8a6410">computes, replaceable</text>
  <line x1="735" y1="375" x2="813" y2="375" stroke="#a87a12" stroke-width="2" marker-start="url(#r)" marker-end="url(#r)"/>

  <!-- the store -->
  <rect x="1025" y="40" width="155" height="640" rx="10" fill="#eef3f8" stroke="#2f5f8a"/>
  <text x="1102" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5f8a">store/</text>
  <text x="1102" y="84" text-anchor="middle" font-size="12" fill="#2f5f8a">the agent's history</text>
  <rect x="1040" y="110" width="125" height="170" rx="7" fill="#fff" stroke="#2f5f8a" stroke-width="1.5"/>
  <text x="1102" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5f8a">[data]</text>
  <text x="1102" y="160" text-anchor="middle" font-size="13" fill="#2f5f8a">memory</text>
  <text x="1102" y="186" text-anchor="middle" font-size="12" fill="#2f5f8a">experiences,</text>
  <text x="1102" y="204" text-anchor="middle" font-size="12" fill="#2f5f8a">hypotheses,</text>
  <text x="1102" y="222" text-anchor="middle" font-size="12" fill="#2f5f8a">thoughts, choices</text>
  <text x="1102" y="252" text-anchor="middle" font-size="12" font-style="italic" fill="#2f5f8a">revised in place</text>
  <rect x="1040" y="450" width="125" height="210" rx="7" fill="#fff" stroke="#2f5f8a" stroke-width="1.5"/>
  <text x="1102" y="478" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5f8a">[event]</text>
  <text x="1102" y="500" text-anchor="middle" font-size="13" fill="#2f5f8a">the record</text>
  <g fill="#eef3f8" stroke="#2f5f8a">
    <rect x="1050" y="514" width="105" height="18"/><rect x="1050" y="536" width="105" height="18"/><rect x="1050" y="558" width="105" height="18"/>
  </g>
  <text x="1102" y="527" text-anchor="middle" font-size="10" fill="#2f5f8a">scar · held_by</text>
  <text x="1102" y="549" text-anchor="middle" font-size="10" fill="#2f5f8a">seal · built_from</text>
  <text x="1102" y="571" text-anchor="middle" font-size="10" fill="#2f5f8a">read · read-record</text>
  <text x="1102" y="600" text-anchor="middle" font-size="12" fill="#2f5f8a">append-only,</text>
  <text x="1102" y="618" text-anchor="middle" font-size="12" fill="#2f5f8a">hash-chained;</text>
  <text x="1102" y="636" text-anchor="middle" font-size="12" font-style="italic" fill="#2f5f8a">read, never altered</text>

  <!-- flows -->
  <!-- region -> sensory organs -->
  <path d="M245,150 L303,150" stroke="#2f5f8a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="274" y="140" text-anchor="middle" font-size="12" fill="#1a1a1a">returns</text>
  <!-- onlooker -> sensory organs, round the region -->
  <path d="M45,545 L32,545 L32,68 L288,68 L288,100 L303,100" stroke="#2f5f8a" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="160" y="63" text-anchor="middle" font-size="12" fill="#1a1a1a">remarks</text>
  <!-- sensory organs -> T1 -->
  <path d="M497,145 L514,145 L514,610 L573,610" stroke="#2f5f8a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M514,500 L573,500" stroke="#2f5f8a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="543" y="602" text-anchor="middle" font-size="12" fill="#1a1a1a">signals</text>
  <!-- mind -> effectors: the command -->
  <path d="M902,452 L902,660 L400,660 L400,622" stroke="#a87a12" stroke-width="2.5" fill="none" marker-end="url(#r)"/>
  <text x="655" y="652" text-anchor="middle" font-size="12" fill="#8a6410">the command: T5's test — any layer may emit</text>
  <!-- effectors -> region -->
  <path d="M305,565 L262,565 L262,255 L247,255" stroke="#2f5f8a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="283" y="380" font-size="12" fill="#1a1a1a" text-anchor="middle" transform="rotate(-90 283 380)">acts</text>
  <!-- acts seen by the onlooker -->
  <path d="M262,590 L247,590" stroke="#2f5f8a" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a)"/>
  <!-- mind <-> data -->
  <path d="M992,330 C1015,330 1015,210 1038,210" stroke="#2f5f8a" stroke-width="2" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="1008" y="252" font-size="11" fill="#2f5f8a" text-anchor="end">reads,</text>
  <text x="1008" y="265" font-size="11" fill="#2f5f8a" text-anchor="end">writes</text>
  <!-- event -> mind: reads the record -->
  <path d="M1038,520 C1010,520 1010,430 992,430" stroke="#2f5f8a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="1002" y="500" font-size="11" fill="#2f5f8a" text-anchor="end">reads</text>
  <!-- layers -> event: every pass recorded -->
  <path d="M655,682 L655,700 L1102,700 L1102,682" stroke="#2f5f8a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="878" y="726" text-anchor="middle" font-size="12" fill="#2f5f8a">every layer's pass, every scar, every write and every read recorded</text>
</svg>
