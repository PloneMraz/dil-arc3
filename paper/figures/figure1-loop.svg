<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="745" viewBox="0 0 1200 745" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5442c"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/>
    </marker>
  </defs>
  <rect width="1200" height="745" fill="#ffffff"/>

  <!-- the world -->
  <rect x="20" y="20" width="250" height="700" rx="10" fill="#f4f1ea" stroke="#c9c1ae"/>
  <text x="145" y="48" text-anchor="middle" font-size="15" fill="#6d6352" letter-spacing="1">THE WORLD</text>
  <rect x="45" y="80" width="200" height="190" rx="8" fill="#ffffff" stroke="#8a7f69" stroke-width="1.5"/>
  <text x="145" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Region</text>
  <text x="145" y="136" text-anchor="middle" font-size="14" fill="#444">an ARC-AGI-3 game</text>
  <g transform="translate(103,152)">
    <rect width="84" height="84" fill="#eee" stroke="#999"/>
    <rect x="12" y="12" width="20" height="20" fill="#4a7bd0"/><rect x="52" y="12" width="20" height="20" fill="#e3a72f"/>
    <rect x="12" y="52" width="20" height="20" fill="#e3a72f"/><rect x="32" y="32" width="20" height="20" fill="#c94f3a"/>
    <rect x="52" y="52" width="20" height="20" fill="#4a7bd0"/>
  </g>
  <rect x="45" y="470" width="200" height="150" rx="8" fill="#ffffff" stroke="#8a7f69" stroke-width="1.5"/>
  <text x="145" y="502" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Onlooker</text>
  <text x="145" y="526" text-anchor="middle" font-size="14" fill="#444">an Other: sees acts,</text>
  <text x="145" y="546" text-anchor="middle" font-size="14" fill="#444">not the game; says</text>
  <text x="145" y="566" text-anchor="middle" font-size="14" fill="#444">"repeating", "standing</text>
  <text x="145" y="586" text-anchor="middle" font-size="14" fill="#444">still", "back-and-forth"</text>

  <!-- the host -->
  <rect x="305" y="80" width="190" height="130" rx="8" fill="#e8f0f8" stroke="#5b7fa6" stroke-width="1.5"/>
  <text x="400" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3d5c">Host</text>
  <text x="400" y="134" text-anchor="middle" font-size="15" fill="#1f3d5c">sensory organs</text>
  <text x="400" y="158" text-anchor="middle" font-size="13" fill="#3f5a75">take in the frame, the</text>
  <text x="400" y="176" text-anchor="middle" font-size="13" fill="#3f5a75">status, the onlooker's word;</text>
  <text x="400" y="194" text-anchor="middle" font-size="13" fill="#3f5a75">compute nothing</text>
  <rect x="305" y="510" width="190" height="110" rx="8" fill="#e8f0f8" stroke="#5b7fa6" stroke-width="1.5"/>
  <text x="400" y="540" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3d5c">Host</text>
  <text x="400" y="564" text-anchor="middle" font-size="15" fill="#1f3d5c">effectors</text>
  <text x="400" y="588" text-anchor="middle" font-size="13" fill="#3f5a75">carry out the command,</text>
  <text x="400" y="606" text-anchor="middle" font-size="13" fill="#3f5a75">if the region offers it</text>

  <!-- DIL: the field and the layers -->
  <rect x="530" y="40" width="250" height="640" rx="10" fill="#fbf6e6" stroke="#d8c58a" stroke-dasharray="6 4"/>
  <text x="655" y="64" text-anchor="middle" font-size="13" fill="#8a6d1d">GLOB-MOD field: trust · alertness ·</text>
  <text x="655" y="82" text-anchor="middle" font-size="13" fill="#8a6d1d">exploration — reaches every layer</text>
  <g font-size="14" fill="#222">
    <rect x="575" y="590" width="160" height="40" rx="5" fill="#fff" stroke="#888"/><text x="662" y="615" text-anchor="middle">T1  environment</text>
    <rect x="575" y="535" width="160" height="40" rx="5" fill="#fff" stroke="#888"/><text x="655" y="560" text-anchor="middle">T2  agency</text>
    <rect x="575" y="480" width="160" height="40" rx="5" fill="#fff" stroke="#888"/><text x="655" y="505" text-anchor="middle">T3  channels</text>
    <rect x="575" y="425" width="160" height="40" rx="5" fill="#fff" stroke="#888"/><text x="655" y="450" text-anchor="middle">T4  binding</text>
    <rect x="575" y="345" width="160" height="60" rx="5" fill="#fff4f0" stroke="#b5442c" stroke-width="2"/><text x="655" y="371" text-anchor="middle" font-weight="bold" fill="#8c2f1b">T5  expectation</text><text x="655" y="392" text-anchor="middle" font-size="12" fill="#8c2f1b">return ≠ expected → scar</text>
    <rect x="575" y="270" width="160" height="40" rx="5" fill="#fff" stroke="#888"/><text x="655" y="295" text-anchor="middle">T6  Others</text>
    <rect x="575" y="215" width="160" height="40" rx="5" fill="#fff" stroke="#888"/><text x="655" y="240" text-anchor="middle">T7  absence</text>
    <rect x="575" y="160" width="160" height="40" rx="5" fill="#fff" stroke="#888"/><text x="655" y="185" text-anchor="middle">T8  appraisal</text>
  </g>
  <g stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#g)">
    <line x1="655" y1="589" x2="655" y2="577"/><line x1="655" y1="534" x2="655" y2="522"/>
    <line x1="655" y1="479" x2="655" y2="467"/><line x1="655" y1="424" x2="655" y2="407"/>
    <line x1="655" y1="344" x2="655" y2="312"/><line x1="655" y1="269" x2="655" y2="257"/>
    <line x1="655" y1="214" x2="655" y2="202"/>
  </g>
  <text x="655" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d1d">DIL</text>
  <text x="655" y="146" text-anchor="middle" font-size="12" fill="#8a6d1d">acts on nothing</text>

  <!-- the mind -->
  <rect x="815" y="300" width="175" height="150" rx="10" fill="#fdecea" stroke="#b5442c" stroke-width="2"/>
  <text x="902" y="328" text-anchor="middle" font-size="18" font-weight="bold" fill="#8c2f1b">Mind</text>
  <text x="902" y="352" text-anchor="middle" font-size="13" fill="#5e2316">expects; thinks on</text>
  <text x="902" y="370" text-anchor="middle" font-size="13" fill="#5e2316">what collided; chooses</text>
  <rect x="828" y="384" width="149" height="50" rx="6" fill="#ffffff" stroke="#c97b6b"/>
  <text x="902" y="405" text-anchor="middle" font-size="13" fill="#5e2316">model (inducer)</text>
  <text x="902" y="423" text-anchor="middle" font-size="11" fill="#7a4a3f">computes, replaceable</text>
  <line x1="735" y1="375" x2="813" y2="375" stroke="#b5442c" stroke-width="2" marker-start="url(#r)" marker-end="url(#r)"/>

  <!-- the store -->
  <rect x="1025" y="40" width="155" height="640" rx="10" fill="#eef5ec" stroke="#79a06f"/>
  <text x="1102" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5527">store/</text>
  <text x="1102" y="84" text-anchor="middle" font-size="12" fill="#2f5527">the agent's history</text>
  <rect x="1040" y="110" width="125" height="170" rx="7" fill="#fff" stroke="#79a06f" stroke-width="1.5"/>
  <text x="1102" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5527">[data]</text>
  <text x="1102" y="160" text-anchor="middle" font-size="13" fill="#2f5527">memory</text>
  <text x="1102" y="186" text-anchor="middle" font-size="12" fill="#3f6636">experiences,</text>
  <text x="1102" y="204" text-anchor="middle" font-size="12" fill="#3f6636">hypotheses,</text>
  <text x="1102" y="222" text-anchor="middle" font-size="12" fill="#3f6636">thoughts, choices</text>
  <text x="1102" y="252" text-anchor="middle" font-size="12" font-style="italic" fill="#3f6636">revised in place</text>
  <rect x="1040" y="450" width="125" height="210" rx="7" fill="#fff" stroke="#79a06f" stroke-width="1.5"/>
  <text x="1102" y="478" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5527">[event]</text>
  <text x="1102" y="500" text-anchor="middle" font-size="13" fill="#2f5527">the record</text>
  <g fill="#e2eedf" stroke="#79a06f">
    <rect x="1050" y="514" width="105" height="18"/><rect x="1050" y="536" width="105" height="18"/><rect x="1050" y="558" width="105" height="18"/>
  </g>
  <text x="1102" y="527" text-anchor="middle" font-size="10" fill="#2f5527">scar · held_by</text>
  <text x="1102" y="549" text-anchor="middle" font-size="10" fill="#2f5527">seal · built_from</text>
  <text x="1102" y="571" text-anchor="middle" font-size="10" fill="#2f5527">read · read-record</text>
  <text x="1102" y="600" text-anchor="middle" font-size="12" fill="#3f6636">append-only,</text>
  <text x="1102" y="618" text-anchor="middle" font-size="12" fill="#3f6636">hash-chained;</text>
  <text x="1102" y="636" text-anchor="middle" font-size="12" font-style="italic" fill="#3f6636">read, never altered</text>

  <!-- flows -->
  <!-- region -> sensory organs -->
  <path d="M245,150 L303,150" stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="274" y="140" text-anchor="middle" font-size="12" fill="#333">returns</text>
  <!-- onlooker -> sensory organs, round the region -->
  <path d="M45,545 L32,545 L32,68 L288,68 L288,100 L303,100" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="160" y="63" text-anchor="middle" font-size="12" fill="#333">remarks</text>
  <!-- sensory organs -> T1 -->
  <path d="M497,145 L514,145 L514,610 L573,610" stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="543" y="602" text-anchor="middle" font-size="12" fill="#333">signals</text>
  <!-- mind -> effectors: the command -->
  <path d="M902,452 L902,660 L400,660 L400,622" stroke="#b5442c" stroke-width="2.5" fill="none" marker-end="url(#r)"/>
  <text x="680" y="652" text-anchor="middle" font-size="13" fill="#8c2f1b">the command: T5's test</text>
  <!-- effectors -> region -->
  <path d="M305,565 L262,565 L262,255 L247,255" stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="283" y="380" font-size="12" fill="#333" text-anchor="middle" transform="rotate(-90 283 380)">acts</text>
  <!-- acts seen by the onlooker -->
  <path d="M262,590 L247,590" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a)"/>
  <!-- mind <-> data -->
  <path d="M992,330 C1015,330 1015,210 1038,210" stroke="#2f5527" stroke-width="2" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="1008" y="252" font-size="11" fill="#2f5527" text-anchor="end">reads,</text>
  <text x="1008" y="265" font-size="11" fill="#2f5527" text-anchor="end">writes</text>
  <!-- event -> mind: reads the record -->
  <path d="M1038,520 C1010,520 1010,430 992,430" stroke="#2f5527" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="1002" y="500" font-size="11" fill="#2f5527" text-anchor="end">reads</text>
  <!-- layers -> event: every pass recorded -->
  <path d="M655,682 L655,700 L1102,700 L1102,682" stroke="#79a06f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="878" y="726" text-anchor="middle" font-size="12" fill="#2f5527">every layer's pass, every scar, every write and every read recorded</text>
</svg>
